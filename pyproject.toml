[project]
name = "handctl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Diego Maidana", email = "diegomaidana2@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "evdev>=2.0.0",
    "faster-whisper>=1.2.1",
    "mediapipe>=1.2.3",
    "numpy>=2.5.5",
    "nvidia-cublas-cu12>=12.9.3.13",
    "nvidia-cudnn-cu12>=9,<10",
    "opencv-python>=5.1.0.95",
    "pyqt6>=6.12.1",
]

[project.scripts]
handctl = "handctl:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

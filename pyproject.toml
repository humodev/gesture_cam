[project]
name = "handctl"
version = "0.2.0"
description = "Controlá la computadora con las manos usando la webcam: mouse, menú de gestos, dictado, pizarrón e instrumentos."
readme = "README.md"
authors = [
    { name = "Diego Maidana", email = "diegomaidana2@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "mediapipe>=1.2.3",
    "numpy>=2.5.5",
    "opencv-python>=5.1.0.95",
    "pyqt6>=6.12.1",
    "scipy>=1.18.1",
    "sounddevice>=0.5",
    # Linux: mouse/teclado por /dev/uinput
    "evdev-binary>=2.0.0; sys_platform == 'linux'",  # precompilado: no necesita compilador ni headers
    # Mac: mouse/teclado por Quartz (Windows usa SendInput con ctypes, sin dependencias)
    "pynput>=1.8; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=10; sys_platform == 'darwin'",
    # Portapapeles para el dictado fuera de KDE
    "pyperclip>=1.9; sys_platform != 'linux'",
    # CUDA para Whisper en GPU NVIDIA (no existe en Mac)
    "nvidia-cublas-cu12>=12.8,<12.9.3; sys_platform != 'darwin'",  # 12.9.3 no tiene paquete para Windows
    "nvidia-cudnn-cu12>=9,<10; sys_platform != 'darwin'",
]

[project.scripts]
handctl = "handctl:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

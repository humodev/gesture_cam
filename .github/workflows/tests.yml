name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Librerías del sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0t64
      - name: Dependencias (sin CUDA)
        run: uv sync --python 3.12 --no-install-package nvidia-cublas-cu12 --no-install-package nvidia-cudnn-cu12
      - name: Pruebas
        shell: bash
        run: |
          status=0
          for t in plataformas gestos instrumentos; do
            echo "== $t"
            uv run --no-sync python tests/test_$t.py > out_$t.txt 2>&1 || status=1
            cat out_$t.txt
            # Errores visibles como anotaciones (públicas) en la página del commit.
            if grep -qE "^FALLA|Traceback|Error" out_$t.txt; then
              grep -E "^FALLA|Error|error" out_$t.txt | tail -4 | sed "s/^/::error title=$t::/"
            fi
          done
          exit $status
